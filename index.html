<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Miiu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       HINT
  ========================== -->
  <div class="hint">
    phải mở thui
  </div>


  <!-- =========================
       CAT ENVELOPE
  ========================== -->
  <div class="cat-envelope" id="envelope">

    <!-- Tai mèo -->
    <div class="cat-ear ear-left">
      <div class="inner-ear"></div>
    </div>

    <div class="cat-ear ear-right">
      <div class="inner-ear"></div>
    </div>


    <!-- Thân phong bì -->
    <div class="envelope-body">

      <div class="envelope-front"></div>

      <div class="envelope-fold left-fold"></div>

      <div class="envelope-fold right-fold"></div>

    </div>


    <!-- Nắp phong bì + mặt mèo -->
    <div class="cat-flap">

      <div class="cat-face">

        <div class="cat-eye eye-left"></div>
        <div class="cat-eye eye-right"></div>

        <div class="cat-blush blush-left"></div>
        <div class="cat-blush blush-right"></div>

        <div class="cat-nose"></div>

        <div class="cat-mouth left-mouth"></div>
        <div class="cat-mouth right-mouth"></div>

        <div class="whisker whisker-1"></div>
        <div class="whisker whisker-2"></div>
        <div class="whisker whisker-3"></div>
        <div class="whisker whisker-4"></div>

      </div>

    </div>


    <!-- Chân mèo -->
    <div class="cat-paw paw-left">🐾</div>
    <div class="cat-paw paw-right">🐾</div>

  </div>


  <!-- =========================
       FLOWER EFFECT
  ========================== -->
  <div id="flowerLayer"></div>


  <!-- =========================
       MUSIC
  ========================== -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>


  <!-- =========================
       IMAGE VIEWER
  ========================== -->
  <img id="viewer" alt="">


  <!-- =========================
       VIDEO
  ========================== -->
<video
  id="videoViewer"
  playsinline
  preload="auto"
  controls
>
  <source src="video.mp4" type="video/mp4">
</video>


  <!-- =========================
       QUESTION
  ========================== -->
  <div id="questionBox" class="question-box">

    <div class="question-card">

      <img
        src="6.png"
        class="butterfly"
        alt=""
      >

      <p class="question-text">
        Tiểu thư có muốn từ chối không?
      </p>

      <div class="buttons">

        <button id="yesBtn">
          YESN'T
        </button>

        <button
          id="noBtn"
          disabled
        >
          NON'T
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       FINAL
  ========================== -->
  <div id="finalBox" class="final-box">

    <img
      src="5.png"
      alt=""
    >

    <p>
      Ủa có tham gia hỏ hihi cảm ơn
      <b>CÔNG CHÚA</b>
      đã vui vẻ đồng ý tình cảm của
      <b>“tấm thân nhỏ bé”</b>
      nhé.
      <br><br>
      Mong sẽ thấy em với bộ đồ anh tặng
      và hộp quà anh trao 💗
    </p>

  </div>


  <script src="script.js"></script>

</body>
</html>
